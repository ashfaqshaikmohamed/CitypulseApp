# FILE: render.yaml
# ROLE: Defines Render.com services — FastAPI backend, Redis, and PostgreSQL.

services:
  - type: web
    name: citypulse-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: citypulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: citypulse-redis
          type: redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: NYC_311_APP_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: VISION_MOCK
        value: false

  - type: redis
    name: citypulse-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: citypulse-db
    databaseName: citypulse
    user: citypulse
    plan: free