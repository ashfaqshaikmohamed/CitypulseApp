# FILE: render.yaml
# ROLE: Defines all Render.com services — FastAPI backend, Celery worker, PostgreSQL, and Redis.

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: citypulse-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: citypulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: citypulse-redis
          type: redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: NYC_311_APP_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: VISION_MOCK
        value: false

  # ── Celery Worker ────────────────────────────────────────────────────────────
  - type: worker
    name: citypulse-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: citypulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: citypulse-redis
          type: redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: NYC_311_APP_TOKEN
        sync: false
      - key: ENVIRONMENT
        value: production

  # ── Redis ────────────────────────────────────────────────────────────────────
  - type: redis
    name: citypulse-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  # ── PostgreSQL with PostGIS ──────────────────────────────────────────────────
  - name: citypulse-db
    databaseName: citypulse
    user: citypulse
    plan: free
